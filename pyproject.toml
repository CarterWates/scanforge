[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scanforge"
version = "0.1.0"
description = "A defensive, permission-first network scanner with polished terminal reports."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Carter Wates", email = "watescarter@gmail.com" }]
dependencies = [
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
scanforge = "scanforge.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/scanforge"]
